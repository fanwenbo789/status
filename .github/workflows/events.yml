name: Sync status events

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: status-events
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch recent events
        run: python3 sync_events.py

      - name: Commit events
        run: |
          if git diff --quiet -- events.json; then
            echo 'no changes'
            exit 0
          fi
          git config user.name 'fanwenbo789'
          git config user.email '3990891437@qq.com'
          git add events.json
          git commit -m '更新近期事件'
          git push origin HEAD:main
