<!doctype html>
<html lang="zh-CN" class="mdui-theme-light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="BREEZE BLOG 的站点与服务运行状态，由 UptimeRobot 提供监控数据。">
  <meta name="theme-color" content="#29b6f6">
  <link rel="icon" type="image/png" sizes="180x180" href="./assets/favicon.png">
  <title>服务状态监控 | BREEZE BLOG</title>
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('status-theme');
        if (!theme) {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        var root = document.documentElement;
        root.dataset.theme = theme;
        root.classList.remove('mdui-theme-light', 'mdui-theme-dark', 'mdui-theme-auto');
        root.classList.add('mdui-theme-' + theme);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="./assets/mdui.min.css">
  <link rel="stylesheet" href="./styles.css">
  <script src="./assets/mdui.global.min.js"></script>
</head>
<body>
  <mdui-top-app-bar class="status-appbar">
    <div class="appbar-inner">
      <a class="brand-link" href="https://www.breeze.moe/" aria-label="返回 BREEZE BLOG 主站">
        <mdui-card class="brand-card" variant="elevated">
          <span class="brand-text">BREEZE BLOG</span>
        </mdui-card>
      </a>
      <div class="appbar-actions">
        <mdui-button variant="text" href="https://www.breeze.moe/">返回主站</mdui-button>
        <mdui-button-icon id="theme-toggle">
          <svg class="theme-icon-sun" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.8"/>
            <path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.2 5.2l1.6 1.6M17.2 17.2l1.6 1.6M18.8 5.2l-1.6 1.6M6.8 17.2l-1.6 1.6"
                  fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          <svg class="theme-icon-moon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path d="M20.5 14.7A8.6 8.6 0 0 1 9.3 3.5a8.8 8.8 0 1 0 11.2 11.2z"
                  fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          </svg>
          <span class="visually-hidden" id="theme-label">切换深色模式</span>
        </mdui-button-icon>
      </div>
    </div>
  </mdui-top-app-bar>

  <main class="status-main">
    <noscript>
      <div class="noscript">
        此页面需要启用 JavaScript 才能加载实时监控数据。
        <a href="https://www.breeze.moe/">返回主站</a>
      </div>
    </noscript>

    <header class="page-head">
      <h1>服务状态监控</h1>
      <p>相关站点的可用性、响应时间和近期事件。</p>
    </header>

    <mdui-card class="overall-card" variant="elevated">
      <div id="overall" class="overall is-loading" role="status" aria-live="polite">
        <span class="overall-text">正在获取状态…</span>
      </div>
      <p class="page-meta">
        <span id="updated">最后更新：—</span>
      </p>
    </mdui-card>

    <p id="error" class="error" role="alert" hidden></p>

    <section class="status-section" aria-labelledby="monitors-title">
      <div class="section-head">
        <h2 id="monitors-title">监控项</h2>
        <span id="monitor-count" class="section-count"></span>
      </div>
      <div id="monitors" class="monitor-grid">
        <div class="skeleton-card" aria-hidden="true">
          <div class="skeleton-top">
            <span class="skeleton-globe"></span>
            <span class="skeleton-title"></span>
          </div>
          <span class="skeleton-label"></span>
          <div class="skeleton-bars"></div>
          <span class="skeleton-label short"></span>
          <div class="skeleton-chart"></div>
        </div>
        <div class="skeleton-card" aria-hidden="true">
          <div class="skeleton-top">
            <span class="skeleton-globe"></span>
            <span class="skeleton-title"></span>
          </div>
          <span class="skeleton-label"></span>
          <div class="skeleton-bars"></div>
          <span class="skeleton-label short"></span>
          <div class="skeleton-chart"></div>
        </div>
      </div>
    </section>

    <section class="status-section" aria-labelledby="events-title">
      <div class="section-head">
        <h2 id="events-title">近期事件</h2>
        <span id="event-count" class="section-count"></span>
      </div>
      <mdui-card id="events" class="events" variant="elevated">
        <p class="empty">正在获取事件…</p>
      </mdui-card>
    </section>
  </main>

  <footer class="status-footer">
    <mdui-card class="footer-card" variant="elevated">
      <div class="footer-inner">
        <div>
          <span>© <span id="year">2026</span> BREEZE BLOG</span>
          <span class="footer-divider" aria-hidden="true"></span>
          <span class="footer-note">数据来自 UptimeRobot</span>
        </div>
      </div>
    </mdui-card>
  </footer>

  <script src="./config.js"></script>
  <script src="./app.js"></script>
</body>
</html>
