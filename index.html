<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="赤羽 Akabane 的站点与服务运行状态，由 UptimeRobot 提供监控数据。">
  <meta name="theme-color" content="#29b6f6">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='%2329b6f6'/%3E%3C/svg%3E">
  <title>服务状态 | 赤羽 Akabane</title>
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('status-theme');
        if (!theme) {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="topbar">
    <div class="shell topbar-inner">
      <a class="brand" href="https://www.akabane.cn/" aria-label="返回赤羽 Akabane 博客">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>Akabane <strong>Status</strong></span>
      </a>
      <div class="topbar-actions">
        <span id="demo-badge" class="demo-badge" hidden>预览数据</span>
        <button id="theme-toggle" class="icon-button" type="button" aria-label="切换深色模式">
          <svg class="icon-sun" viewBox="0 0 24 24" width="19" height="19" aria-hidden="true">
            <circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.8"/>
            <path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.2 5.2l1.6 1.6M17.2 17.2l1.6 1.6M18.8 5.2l-1.6 1.6M6.8 17.2l-1.6 1.6"
                  fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" width="19" height="19" aria-hidden="true">
            <path d="M20.5 14.7A8.6 8.6 0 0 1 9.3 3.5a8.8 8.8 0 1 0 11.2 11.2z"
                  fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main class="shell">
    <section class="hero">
      <p class="eyebrow">服务状态</p>
      <h1>系统运行状态</h1>
      <p class="hero-sub">这里汇总 Akabane 相关站点的可用性、响应时间和近期事件。</p>
      <div id="overall" class="overall is-loading" role="status" aria-live="polite">
        <span class="status-dot" aria-hidden="true"></span>
        <span class="overall-text">正在获取状态…</span>
      </div>
      <p class="hero-meta">
        <span id="updated">最后更新：—</span>
        <span class="meta-sep" aria-hidden="true">·</span>
        <span>每 60 秒自动刷新</span>
      </p>
    </section>

    <section class="section" aria-labelledby="monitors-title">
      <div class="section-head">
        <h2 id="monitors-title">监控项</h2>
        <span id="monitor-count" class="section-count"></span>
      </div>
      <div id="monitors" class="monitor-grid" aria-live="polite">
        <div class="skeleton-card" aria-hidden="true"></div>
        <div class="skeleton-card" aria-hidden="true"></div>
        <div class="skeleton-card" aria-hidden="true"></div>
      </div>
    </section>

    <section class="section" aria-labelledby="events-title">
      <div class="section-head">
        <h2 id="events-title">近期事件</h2>
        <span id="event-count" class="section-count"></span>
      </div>
      <div id="events" class="events" aria-live="polite">
        <p class="empty">正在获取事件…</p>
      </div>
    </section>

    <p id="error" class="error" role="alert" hidden></p>
  </main>

  <footer class="footer shell">
    <p>数据来自 UptimeRobot · <a href="https://www.akabane.cn/">返回博客</a></p>
    <p id="footer-demo" class="footer-demo" hidden>当前为本地预览数据，不是真实监控结果。</p>
  </footer>

  <script src="./app.js"></script>
</body>
</html>
